name: Missao 11.1 - IA interna sem custos
on:
  push:
    branches:
      - feat/uppulse-missao10-supercatalogo
    paths:
      - 'client/src/components/CatalogAssistant.tsx'
      - 'client/src/components/ProductKnowledge.tsx'
      - 'client/src/components/Header.tsx'
      - 'client/src/components/MasterOffers.tsx'
      - 'client/src/lib/catalogAssistant*'
      - 'server/productIntelligence/knowledgeRoutes.ts'
      - 'server/routes.ts'
      - '.github/workflows/mission11-ai-validation.yml'
      - 'playwright.mission11-ai.config.ts'
      - 'tests/e2e/ai/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Instalar dependencias
        run: npm ci --ignore-scripts
      - name: TypeScript
        run: npm run check
      - name: Teste do consultor local sem APIs externas
        run: node --import tsx --test client/src/lib/catalogAssistant.test.ts
        env:
          RESEARCH_PAID_ENABLED: 'false'
          RESEARCH_POSTGRES_HOMOLOGATED: 'false'
      - name: Build do cliente e servidor
        run: npm run build
        env:
          RESEARCH_PAID_ENABLED: 'false'
          RESEARCH_POSTGRES_HOMOLOGATED: 'false'

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testar consultor e ficha IA no navegador
        run: npx playwright test --config=playwright.mission11-ai.config.ts
        env:
          CI: 'true'
          DATABASE_URL: 'postgresql://test:test@127.0.0.1:5432/test'
          UPPULSE_DISABLE_EXTERNAL_JOBS: 'true'
          RESEARCH_PAID_ENABLED: 'false'
          RESEARCH_POSTGRES_HOMOLOGATED: 'false'
      - name: Preservar rastros de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mission11-ai-playwright-failures
          path: |
            test-results/mission11-ai
            playwright-report/mission11-ai
          if-no-files-found: ignore
